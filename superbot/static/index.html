<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SUPERBOT // C0</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">SUPERBOT</span>
        <span class="brand-tag">C0</span>
      </div>
      <div class="status-cluster">
        <span id="state" class="badge">stopped</span>
        <span id="session-id"></span>
        <span id="uptime"></span>
      </div>
      <div class="top-actions">
        <button id="start" class="btn btn-go" disabled>▶ Start</button>
        <button id="stop" class="btn btn-halt" disabled>■ Stop</button>
        <button id="mute-audio" class="btn" disabled>Mute game audio</button>
      </div>
    </header>

    <main class="deck">
      <section class="stage">
        <div class="stage-views">
          <section class="preview" id="preview-box">
            <div class="preview-clip" id="preview-clip">
              <div id="preview" tabindex="-1"></div>
            </div>
            <div id="preview-wait">session stopped</div>
            <div id="manual-overlay" class="manual-overlay">
              <div class="manual-panel">
                <strong id="manual-title"></strong>
                <span id="manual-detail"></span>
              </div>
            </div>
            <form id="vnc-auth" class="vnc-auth">
              <label>Username <input id="vnc-user" autocomplete="username" required></label>
              <label>Password <input id="vnc-pass" type="password" autocomplete="current-password" aria-describedby="vnc-error" required></label>
              <button type="submit">Connect preview</button>
              <p id="vnc-error" role="alert"></p>
            </form>
          </section>
          <aside id="body-box">
            <div class="body-head">
              <span class="body-title">Robot</span>
              <button id="body-start" type="button" disabled>Start</button>
              <button id="body-stop" type="button" disabled>Stop</button>
            </div>
            <div id="body-tiles-top" class="body-tiles"></div>
            <div class="body-spacer"></div>
            <div id="body-tiles" class="body-tiles"></div>
            <div id="body-wait">body view off</div>
          </aside>
        </div>
        <p id="error" class="error" role="alert"></p>
      </section>

      <aside class="col col-right">
        <section class="panel">
          <h2>Telemetry</h2>
          <div id="health"></div>
        </section>

        <section class="panel">
          <h2>Pose mode</h2>
          <div id="modes">
            <button data-mode="hold" aria-pressed="false" disabled>hold</button>
            <button data-mode="yaw" aria-pressed="false" disabled>yaw</button>
            <button data-mode="trigger" aria-pressed="false" disabled>trigger</button>
            <button data-mode="dodge" aria-pressed="false" disabled>dodge</button>
            <button data-mode="walk" aria-pressed="false" disabled>walk</button>
            <button data-mode="clock" aria-pressed="false" disabled>clock</button>
            <button data-mode="manual" aria-pressed="false" disabled>manual</button>
            <button data-mode="body" aria-pressed="false" disabled>body</button>
          </div>
        </section>

        <section class="panel">
          <h2>Verbs</h2>
          <div class="verbs">
            <button type="button" data-verb="look_left">look left</button>
            <button type="button" data-verb="look_right">look right</button>
            <button type="button" data-verb="aim">aim</button>
            <button type="button" data-verb="punch">punch</button>
            <button type="button" data-verb="dodge_left">dodge left</button>
            <button type="button" data-verb="hold">hold</button>
          </div>
          <h3>Buttons</h3>
          <div class="verbs">
            <button type="button" data-verb="grab_right">grab R</button>
            <button type="button" data-verb="release_right">release R</button>
            <button type="button" data-verb="grab_left">grab L</button>
            <button type="button" data-verb="release_left">release L</button>
            <button type="button" data-verb="fire_right">fire R</button>
            <button type="button" data-verb="fire_left">fire L</button>
          </div>
          <div id="verb-status" class="verb-status"></div>
        </section>

        <section class="panel danger">
          <h2>Danger zone</h2>
          <button id="kill-game" disabled>Kill game</button>
          <button id="kill-steam" disabled>Shutdown Steam</button>
        </section>
      </aside>
    </main>

    <footer class="console">
      <div class="console-head">
        <h2>Logs</h2>
        <div id="log-filters" class="log-filters"></div>
      </div>
      <div id="log-tail" class="log-tail"></div>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
