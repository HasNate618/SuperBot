# superbot configuration — copy to config.toml and edit.
#
# Every value below is read at startup and validated; a bad path fails loudly
# before anything is launched. `config.toml` is git-ignored because it holds
# machine-specific absolute paths.
#
# Relative paths (pose_client, session_root, novnc_web_root) resolve against
# the repository root, not your shell's cwd.

[paths]
# Monado service binary. On NixOS this is the setuid wrapper.
monado_bin = "/run/wrappers/bin/monado-service"

# Tools the orchestrator (and the optional smoke check) drives. These must be
# on PATH or absolute.
weston_bin = "weston"
weston_screenshooter_bin = "weston-screenshooter"
weston_debug_bin = "weston-debug"

# VNC backend and browser client tools. These must be on PATH or absolute.
novnc_bin = "novnc"
websockify_bin = "websockify"

# noVNC web assets directory. Leave empty to derive it from novnc_bin
# (<prefix>/share/webapps/novnc); set it explicitly to override.
# novnc_web_root = ""

# Steam launcher and the game executable.
# steam_bin: the steam *client* launcher, not the runtime's steam binary.
# game_exe:  the .exe itself; it is launched through Steam, not directly.
steam_bin = "/home/YOUR_USER/.local/bin/steam"
game_exe = "/home/YOUR_USER/Games/Job Simulator/JobSimulator.exe"

# Tool used to send the fullscreen client message to the nested compositor.
# Weston's xwm ignores a window's own _NET_WM_STATE_FULLSCREEN, so the game would
# otherwise stay windowed with a title bar. Empty disables the step.
xdotool_bin = "xdotool"

# Unity log, relative to the Proton prefix's pfx/drive_c/users/steamuser.
# The dashboard links it. Job Simulator writes output_log.txt; most Unity
# titles write Player.log.
game_player_log = "AppData/LocalLow/Owlchemy Labs/Job Simulator/output_log.txt"

# Directory whose bin/linux64/vrclient.so implements OpenVR on top of OpenXR,
# exported to Proton as VR_OVERRIDE. Empty means "use whatever
# ~/.config/openvr/openvrpaths.vrpath names". Job Simulator's action manifest
# panics xrizer, so point this at OpenComposite (the devShell sets it for you).
vr_override = ""

# The pose client that feeds fabricated HMD/controller poses to Monado.
pose_client = "spike/c0/c0_client.py"

# OpenXR runtime pointer the game will resolve to.
# READ-ONLY: superbot validates that this file exists and is readable; it never
# writes or replaces it. Create it yourself, see README "Requirements".
openxr_active_runtime = "/home/YOUR_USER/.config/openxr/1/active_runtime.json"

# Where session logs are written.
session_root = "/home/YOUR_USER/.local/state/SuperBot/sessions"

[launch]
# Steam shortcut ID of the non-Steam game entry. Find it in
# ~/.local/share/Steam/userdata/<id>/config/shortcuts.vdf, or in Steam's
# console log as `AppId=` when you launch the game by hand.
shortcut_id = "0000000000000000000"

# Proton app id used for the compatibility prefix. For a non-Steam shortcut
# this is the same numeric id Steam reports as AppId.
proton_app_id = "0000000000"

# The Monado application_name the game connects as, matched as a prefix of the
# "application_name: '...'" line. Job Simulator through OpenComposite reports
# OpenComposite_wine64-preloader, so "OpenComposite" matches it.
openxr_client_name = "OpenComposite"

# Per-eye render scale, in percent. The null compositor reports the
# recommended view size (the flake raises it from 320x240 to 1920x1080) and the
# OpenXR runtime scales each view by OXR_VIEWPORT_SCALE_PERCENTAGE. 100 is native
# 1080p, which is 1:1 with the 1920x1080 mirror and therefore sharpest; 200
# supersamples to 3840x2160 for a little more edge quality at 4x the pixel cost.
# 0 is refused; the ceiling is 400.
viewport_scale_percentage = 100

# xdotool --name pattern for the game window, used to fullscreen it. Empty
# disables the fullscreen step and leaves the game windowed.
game_window = "Job Simulator"

# Extra args passed to Steam. -cef-disable-gpu keeps the Steam UI from
# fighting the game for the GPU on small cards.
steam_extra_args = ["-cef-disable-gpu"]

# Timings, in seconds. Generous by default; tighten once you know your machine.
steam_settle_sec = 60
steam_ready_timeout_sec = 120
game_process_timeout_sec = 180
openxr_client_timeout_sec = 120
startup_timeout_sec = 300

[preview]
# The dashboard's live preview: a Weston VNC stream cropped to remove the
# 32 px status panel. It is not a composite.
width = 1280
height = 720
panel_height = 32
fps = 30

# Weston's VNC backend listens on vnc_port; websockify proxies it to the
# browser on proxy_port. Both must be in 1..65535, differ from each other, and
# differ from dashboard.port when that is non-zero.
vnc_port = 5901
proxy_port = 6080

[dashboard]
host = "127.0.0.1"
port = 8765

[timeouts]
monado_startup_sec = 20
weston_startup_sec = 20
pose_handshake_sec = 10
stop_sec = 60

[body]
# Third-person MuJoCo view beside the game cam. Needs the SONIC venv + weights,
# so it is off in a bare checkout. `autostart` starts it with the dashboard.
enabled = true
autostart = true
python = "spike/e3/.venv/bin/python"
script = "spike/wbc/body_view.py"
fps = 10
width = 560
height = 420
# Cycle the verb reel (hold, look, aim, punch, dodge) instead of holding one
# pose, so the tile shows motion. Set false to sit in the standing hold.
reel = true
# The robot's heading in the virtual room, degrees, positive toward its left.
# The desk needs a 90 deg left turn, and this body cannot twist that far: a
# commanded left look reaches only -28.6 deg (measured), against +54.3 right.
# So the heading is chosen rather than walked. 0.0 leaves everything unchanged.
yaw_offset_deg = 0.0
# The headset's field of view to DECLARE to the runtime, full angles in degrees.
# Give both or neither; 0/0 leaves it undeclared and uses the driver's own 85 deg.
# MEASURED 2026-10-31: leave this 0 for Job Simulator. Declaring a frustum makes the
# game stop rendering (grey background, ~0% CPU) whether it is set at launch or
# only after a mode switch, so the wider view is not worth a dead game here.
# Whether this build honours the declaration is otherwise measured - see
# research/fov-declaration.md.
fov_h_deg = 0.0
fov_v_deg = 0.0
# false = physics and verb buttons only, with no third-person image. Use it when
# the graphics stack is unavailable; the body stays drivable and observable.
render = true
# Camera angles rendered together as tiles; the first is the primary tile.
# The angle buttons retarget the primary tile. One of: three_quarter, front, side, back.
views = ["three_quarter", "side"]
